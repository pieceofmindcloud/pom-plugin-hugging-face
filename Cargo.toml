[package]
name = "pom-plugin-hugging-face"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "POM plugin: search Hugging Face for GGUF models, download them to the machines of a POM network and set the access token."
repository = "https://github.com/pieceofmindcloud/pom-plugin-hugging-face"
build = "build.rs"

[lib]
crate-type = ["cdylib"]

[dependencies]
serde_json = "1"

[[test]]
name = "contract"
path = "tests/contract.rs"
